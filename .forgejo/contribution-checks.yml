name: Contribution checks

on:
  pull_request:
    branches:
      - main

jobs:
  cla-check:
    name: CLA signature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CLA signature
        run: |
          AUTHOR="${{ gitea.event.pull_request.user.login }}"
          if grep -qi "$AUTHOR" CLA-signatures/individuals.md; then
            echo "✅ CLA signed by $AUTHOR"
          else
            echo "❌ $AUTHOR has not signed the Vidocq CLA."
            echo ""
            echo "Please open a separate pull request adding your name to"
            echo "CLA-signatures/individuals.md before contributing."
            echo "See CONTRIBUTING.md for instructions."
            exit 1
          fi

  gpg-check:
    name: GPG signature check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import contributors public keys
        run: |
          # Import all public keys declared by contributors
          # Keys are stored in .forgejo/keys/ as <codeberg-username>.asc
          for keyfile in .forgejo/keys/*.asc; do
            gpg --import "$keyfile" 2>/dev/null && \
              echo "Imported key: $keyfile" || true
          done

      - name: Check GPG signatures on all commits
        run: |
          FAILED=0
          git log origin/main..HEAD --format="%H %ae" | while read hash email; do
            if git verify-commit "$hash" 2>/dev/null; then
              echo "✅ $hash ($email)"
            else
              echo "❌ $hash ($email) is not GPG-signed or signature is invalid"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must be GPG-signed."
            echo "See CONTRIBUTING.md#set-up-gpg-commit-signing for instructions."
            exit 1
          fi

  signoff-check:
    name: Signed-off-by check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by on all commits
        run: |
          FAILED=0
          git log origin/main..HEAD --format="%H" | while read hash; do
            body=$(git log -1 --format="%B" "$hash")
            if echo "$body" | grep -q "^Signed-off-by:"; then
              echo "✅ $hash has Signed-off-by"
            else
              echo "❌ $hash is missing Signed-off-by"
              FAILED=1
            fi
          done
          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "All commits must have a Signed-off-by trailer."
            echo "Use: git config --local format.signoff true"
            echo "Or:  git commit --signoff"
            exit 1
          fi
